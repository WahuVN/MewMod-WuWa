name: Build and Release MewMod WuWa

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Standalone Executable
        run: |
          python build_release.py

      - name: Create Release Archive (ZIP)
        run: |
          Compress-Archive -Path dist/MewModWuWa/* -DestinationPath dist/MewModWuWa-Standalone.zip -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MewModWuWa-Standalone
          path: dist/MewModWuWa-Standalone.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MewModWuWa-Standalone.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}